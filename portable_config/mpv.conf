# AnimeJaNai 播放配置
include="~~/mpv-animejanai.conf"
profile=animejanai
# Composite subtitles in screen coordinates so danmaku remains visible in letterbox bars.
blend-subtitles=no
osc=no
# Left/right seeking uses the bottom Hills timeline; suppress mpv's duplicate OSD seek bar.
osd-on-seek=no
border=yes
title-bar=yes
fullscreen=no
window-maximized=no
autofit-larger=1280x720
cursor-autohide=1000
prefetch-playlist=no
demuxer-cache-wait=no
network-timeout=20
