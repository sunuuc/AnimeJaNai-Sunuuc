name: flutter_build_release

# 仅允许手动触发
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release 标题 (例如:v1.0.0)'
        required: true
        type: string
      is_use_oh_flutter_cache:
        description: '是否使用oh flutter缓存'
        required: true
        type: boolean
        default: true

jobs:
  build_windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 使用本项目
      - name: Checkout Code
        uses: actions/checkout@v6
      # windows C++组件
      - name: Install dependencies
        uses: microsoft/setup-msbuild@v3
      #设置flutter
      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          # The Flutter version to make available on the path
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'

      # 获取 Flutter 依赖
      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: gui/danmakufactory_flutter
        shell: bash
      # 构建
      - name: Build Flutter for windows
        run: |
          flutter build windows -v
        working-directory: gui/danmakufactory_flutter
        shell: bash

      - name: Zip Windows Build
        run: Compress-Archive -Path "gui/danmakufactory_flutter/build/windows/x64/runner/Release/*" -DestinationPath "danmakufactory_windows_amd64.zip"
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: danmakufactory_windows_amd64.zip

  build_linux_android_harmony:
    runs-on: ubuntu-latest
    # 必须赋予写权限，否则无法创建 Release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # 安装依赖
      - name: Install Harmony dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa
        shell: bash

      - name: Install Linux dependencies
        run: |
          sudo apt install clang cmake ninja-build pkg-config mesa-utils libgtk-3-dev -y
        shell: bash

      # 安装鸿蒙工具链
      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      # 配置 Java 环境
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'

      # 缓存 flutter-ohos SDK
      - name: Cache flutter-ohos
        uses: actions/cache@v5
        id: cache-flutter-ohos
        with:
          path: ${{ github.workspace }}/flutter
          key: flutter-ohos-oh-dev-${{ runner.os }}

      # 如果 强制更新 或 缓存不存在 才 clone
      - name: Setup flutter-ohos
        if: inputs.is_use_oh_flutter_cache == 'false' || steps.cache-flutter-ohos.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf $GITHUB_WORKSPACE/flutter
          git clone -b oh-3.35.7-dev https://gitcode.com/openharmony-tpc/flutter_flutter.git $GITHUB_WORKSPACE/flutter
        shell: bash

      # 添加 flutter PATH
      - name: Add flutter to PATH
        run: |
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Flutter Doctor
        run: flutter doctor -v
        shell: bash

      # 获取 Flutter 依赖
      - name: Get Flutter dependencies
        run: |
          flutter pub get
          
          echo "kotlin.incremental=false" >> android/gradle.properties
          
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/danmakufactory.jks
          
          echo "storeFile=./danmakufactory.jks" > android/key.properties
          echo "storePassword=${KEYSTORE_PASSWORD}" >> android/key.properties
          echo "keyAlias=${KEY_ALIAS}" >> android/key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties

        working-directory: gui/danmakufactory_flutter
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 构建 ohos
      - name: Build Flutter for ohos
        run: |
          flutter build hap --release -v
        working-directory: gui/danmakufactory_flutter
        shell: bash
        continue-on-error: true

      # 构建 Linux
      - name: Build Flutter for Linux
        run: |
          flutter build linux --release -v
        working-directory: gui/danmakufactory_flutter
        shell: bash

      # 压缩linux产物
      - name: tar Linux Build
        run: |
          tar -zcvf danmaku_factory_linux.tar.gz -C gui/danmakufactory_flutter/build/linux/x64/release/bundle/ .
        shell: bash

      # 构建 Android
      - name: Build Flutter for Android
        run: |
          flutter build apk --release --split-per-abi -v
        working-directory: gui/danmakufactory_flutter
        shell: bash

      # copy Artifact
      - name: copy Artifact
        run: |
          cp gui/danmakufactory_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk .
          cp gui/danmakufactory_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk .
          cp gui/danmakufactory_flutter/ohos/entry/build/default/outputs/default/entry-default-unsigned.hap .
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-android-harmony-build
          path: |
            danmaku_factory_linux.tar.gz
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            entry-default-unsigned.hap


  build_macos:
    runs-on: macos-latest
    # 必须赋予写权限，否则无法创建 Release
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      #设置flutter
      - uses: subosito/flutter-action@v2
        with:
          # The Flutter version to make available on the path
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'

      - name: Build macOS
        working-directory: gui/danmakufactory_flutter
        run: |
          flutter pub get
          flutter build macos --release -v

      - name: Package App
        run: |
          cd gui/danmakufactory_flutter/build/macos/Build/Products/Release
          zip -r danmakufactory_macos_arm.zip danmakufactory_flutter.app
          cp danmakufactory_macos_arm.zip $GITHUB_WORKSPACE/

      - name: Upload macOS
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: danmakufactory_macos_arm.zip


  create-release:
    runs-on: ubuntu-latest
    needs: [build_windows, build_linux_android_harmony, build_macos]
    permissions:
      contents: write

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v8
        with:
          name: windows-build

      - name: Download linux_android_harmony Build
        uses: actions/download-artifact@v8
        with:
          name: linux-android-harmony-build

      - name: Download macos Build
        uses: actions/download-artifact@v8
        with:
          name: macos-build

      # 上传到 GitHub Releases
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_name }}
          name: ${{ inputs.release_name }}      # 取自手动触发时填写的标题
          # 使用通配符 *.apk，把 output 目录下所有的分架构包都传上去
          files: |
            danmakufactory_windows_amd64.zip
            danmaku_factory_linux.tar.gz
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            entry-default-unsigned.hap
            danmakufactory_macos_arm.zip
          generate_release_notes: true          # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}