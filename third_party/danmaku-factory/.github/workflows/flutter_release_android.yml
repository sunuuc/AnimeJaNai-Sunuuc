name: Flutter Release Android
on:
  # 手动触发
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # 使用本项目
      - uses: actions/checkout@v6

      # 设置flutter
      - uses: subosito/flutter-action@v2
        with:
          # The Flutter version to make available on the path
          flutter-version: 3.35.7
          # The Flutter build release channel
          channel: stable
          cache: true

      # 设置jdk
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.8'
          actions-cache-folder: '.xmake-cache'


      # 切换到Flutter项目目录并构建
      - name: Build
        working-directory: gui/danmakufactory_flutter
        shell: bash
        run: |
          flutter pub get
          
          echo "kotlin.incremental=false" >> android/gradle.properties
        
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/danmakufactory.jks
          
          echo "storeFile=./danmakufactory.jks" > android/key.properties
          echo "storePassword=${KEYSTORE_PASSWORD}" >> android/key.properties
          echo "keyAlias=${KEY_ALIAS}" >> android/key.properties
          echo "keyPassword=${KEY_PASSWORD}" >> android/key.properties
          
          flutter build apk -v --release --split-per-abi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Artifact x86_64-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: app-x86_64-release
          path: gui/danmakufactory_flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk


      - name: Upload Artifact arm64-v8a-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-release
          path: gui/danmakufactory_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk