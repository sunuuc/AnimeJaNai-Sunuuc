name: zh-CN Personal 1600p Overlay

on:
  push:
    branches: [zh-CN]
    paths:
      - '.github/workflows/zh-cn-personal-1600p.yml'
      - 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai/animejanai/animejanai.conf'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout AnimeJaNai fork
        uses: actions/checkout@v4

      - name: Checkout Chinese Manager
        uses: actions/checkout@v4
        with:
          repository: sunuuc/AnimeJaNaiManager
          ref: zh-CN
          path: manager-src

      - name: Checkout mpv.net v7.1.2.0
        uses: actions/checkout@v4
        with:
          repository: mpvnet-player/mpv.net
          ref: v7.1.2.0
          path: mpvnet-src

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build native Chinese Manager
        shell: pwsh
        run: |
          $path = 'manager-src/scripts/ApplyNativeChinese.ps1'
          $src = Get-Content $path -Raw
          $src = $src.Replace('function Apply-ExactSourceReplacements([string]$rel, [ordered]$replacements)', 'function Apply-ExactSourceReplacements([string]$rel, $replacements)')
          Set-Content -Path $path -Value $src -Encoding utf8
          ./manager-src/scripts/ApplyNativeChinese.ps1

          $csPath = 'manager-src/AnimeJaNaiConfEditor/Views/MainWindow.axaml.cs'
          $cs = Get-Content $csPath -Raw
          $cs = $cs.Replace('+ +', '+')
          Set-Content -Path $csPath -Value $cs -Encoding utf8

          $xamlPath = 'manager-src/AnimeJaNaiConfEditor/Views/MainWindow.axaml'
          $xaml = Get-Content $xamlPath -Raw
          $xaml = $xaml.Replace('> (Default)<', '>（默认）<')
          $xaml = $xaml.Replace('默认配置（只读）', '官方超分预设（可直接用）')
          $xaml = $xaml.Replace('自定义配置', '我的全场景预设')
          Set-Content -Path $xamlPath -Value $xaml -Encoding utf8

          dotnet publish manager-src/AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -o manager-publish

      - name: Patch and build mpv.net for Player UI
        shell: pwsh
        run: |
          $path = 'mpvnet-src/src/MpvNet/CommandLine.cs'
          $src = Get-Content $path -Raw
          $needle = "            foreach (string i in Environment.GetCommandLineArgs().Skip(1))`r`n            {`r`n                string arg = i;"
          if (-not $src.Contains($needle)) {
            $needle = "            foreach (string i in Environment.GetCommandLineArgs().Skip(1))`n            {`n                string arg = i;"
          }
          if (-not $src.Contains($needle)) { throw 'mpv.net command-line parser pattern not found.' }
          $replacement = $needle.Replace('                string arg = i;', '                if (i == "--{" || i == "--}") continue;`n                string arg = i;')
          $replacement = $replacement.Replace('`n', [Environment]::NewLine)
          $src = $src.Replace($needle, $replacement)
          Set-Content -Path $path -Value $src -Encoding utf8

          dotnet publish mpvnet-src/src/MpvNet.Windows/MpvNet.Windows.csproj `
            -c Release -r win-x64 --self-contained false `
            -o mpvnet-publish

          if (-not (Test-Path 'mpvnet-publish/mpvnet.exe')) { throw 'Patched mpvnet.exe was not built.' }

      - name: Build prerelease-aware component updater
        shell: pwsh
        run: |
          $path = 'AnimeJaNaiUpdater/Program.cs'
          $src = Get-Content $path -Raw
          $oldRepo = 'const string Repo = "the-database/mpv-upscale-2x_animejanai";'
          $newRepo = 'const string Repo = "the-database/mpv-AnimeJaNai";'
          if ($src.Contains($oldRepo)) { $src = $src.Replace($oldRepo, $newRepo) }

          $componentStart = $src.IndexOf('async Task<PackIndex> GetPackIndexAsync()')
          if ($componentStart -lt 0) { throw 'GetPackIndexAsync was not found.' }
          $needle = 'var release = await GetLatestReleaseAsync();'
          $replaceAt = $src.IndexOf($needle, $componentStart)
          if ($replaceAt -lt 0) { throw 'Component release lookup was not found.' }
          $src = $src.Remove($replaceAt, $needle.Length).Insert($replaceAt, 'var release = await GetInstalledReleaseAsync();')

          $marker = 'async Task<Release> GetLatestReleaseAsync()'
          $insertAt = $src.IndexOf($marker)
          if ($insertAt -lt 0) { throw 'GetLatestReleaseAsync was not found.' }
          $helper = @'
          async Task<Release> GetInstalledReleaseAsync()
          {
              string local = ReadManifestString(localManifest, "package_version", ReadLocalVersion())
                  .Trim().TrimStart('v');
              if (string.IsNullOrWhiteSpace(local) || local == "0.0.0")
                  return await GetLatestReleaseAsync();

              string url = $"https://api.github.com/repos/{Repo}/releases/tags/{System.Uri.EscapeDataString(local)}";
              using var client = new HttpClient();
              client.DefaultRequestHeaders.UserAgent.ParseAdd("AnimeJaNaiUpdater");
              string json = await client.GetStringAsync(url);
              using var doc = JsonDocument.Parse(json);
              var root = doc.RootElement;
              string tag = root.GetProperty("tag_name").GetString() ?? "";
              var assets = new List<Asset>();
              if (root.TryGetProperty("assets", out var arr))
              {
                  foreach (var a in arr.EnumerateArray())
                  {
                      assets.Add(new Asset(
                          a.GetProperty("name").GetString() ?? "",
                          a.GetProperty("browser_download_url").GetString() ?? ""));
                  }
              }
              return new Release(tag, assets);
          }

          '@
          $src = $src.Insert($insertAt, $helper)
          Set-Content -Path $path -Value $src -Encoding utf8
          dotnet publish AnimeJaNaiUpdater/AnimeJaNaiUpdater.csproj -c Release -o updater-publish

      - name: Stage 1600p personal overlay
        shell: pwsh
        run: |
          $base = 'BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai'
          New-Item -ItemType Directory -Force -Path 'overlay/portable_config/scripts' | Out-Null
          New-Item -ItemType Directory -Force -Path 'overlay/portable_config/fonts' | Out-Null
          New-Item -ItemType Directory -Force -Path 'overlay/portable_config/script-opts' | Out-Null
          New-Item -ItemType Directory -Force -Path 'overlay/animejanai' | Out-Null
          New-Item -ItemType Directory -Force -Path 'overlay/THIRD_PARTY_LICENSES' | Out-Null

          Copy-Item "$base/animejanai/animejanai.conf" 'overlay/animejanai/animejanai.conf' -Force

          $input = Get-Content "$base/portable_config/input-animejanai.conf" -Raw
          Set-Content -Path 'overlay/portable_config/input-animejanai.conf' -Value $input -Encoding utf8

          $personal = @(
            'Esc      set fullscreen no; show-text "已退出全屏" #menu: 画面 > 退出全屏',
            'Ctrl+0   show-text "AI 处理已关闭（原画原帧率）"; apply-profile upscale-on; script-message aji-slot 0 #menu: AnimeJaNai > 我的预设 > 关闭 AI 处理',
            'Ctrl+1   show-text "只补帧：动画 24→48（默认·稳）"; apply-profile upscale-on; script-message aji-slot 1 #menu: AnimeJaNai > 我的预设 > 1 动画 24→48｜只补帧（默认·稳）',
            'Ctrl+2   show-text "只补帧：动画 24→72（高流畅）"; apply-profile upscale-on; script-message aji-slot 2 #menu: AnimeJaNai > 我的预设 > 2 动画 24→72｜只补帧（高流畅）',
            'Ctrl+3   show-text "只补帧：视频 30→60"; apply-profile upscale-on; script-message aji-slot 3 #menu: AnimeJaNai > 我的预设 > 3 视频 30→60｜只补帧',
            'Ctrl+4   show-text "只超分：1080p→1440p（高效）"; apply-profile upscale-on; script-message aji-slot 4 #menu: AnimeJaNai > 我的预设 > 4 1080p→1440p｜只超分（高效）',
            'Ctrl+5   show-text "只超分：1080p→1440p（保真·高负载）"; apply-profile upscale-on; script-message aji-slot 5 #menu: AnimeJaNai > 我的预设 > 5 1080p→1440p｜只超分（保真）',
            'Ctrl+6   show-text "只超分：720p及以下→最高1440p"; apply-profile upscale-on; script-message aji-slot 6 #menu: AnimeJaNai > 我的预设 > 6 720p及以下→最高1440p｜低清增强',
            'Ctrl+7   show-text "补帧+超分：24→48 + 1080p→1440p（高效）"; apply-profile upscale-on; script-message aji-slot 7 #menu: AnimeJaNai > 我的预设 > 7 24→48 + 1080p→1440p｜高效',
            'Ctrl+8   show-text "补帧+超分：24→48 + 1080p→1440p（保真·高负载）"; apply-profile upscale-on; script-message aji-slot 8 #menu: AnimeJaNai > 我的预设 > 8 24→48 + 1080p→1440p｜保真（高负载）',
            'Ctrl+9   show-text "只补帧：通用 2 倍"; apply-profile upscale-on; script-message aji-slot 9 #menu: AnimeJaNai > 我的预设 > 9 通用 2 倍｜只补帧'
          ) -join "`n"

          $generatedInput = @(
            '# 此区域由 AnimeJaNai 管理。更新时会从 input-animejanai.conf 刷新。',
            '#@ANIMEJANAI-MANAGED-BEGIN (do not edit this line or the block below)',
            $input.TrimEnd(),
            '#@ANIMEJANAI-MANAGED-END (add your keybindings below this line)',
            '',
            '# ===== 你的个人快捷键（更新保留） =====',
            $personal,
            ''
          ) -join "`n"
          Set-Content -Path 'overlay/portable_config/input.conf' -Value $generatedInput -Encoding utf8

          $mpvConf = @(
            '# 个人版：AnimeJaNai + ModernX，针对 2560x1600 屏幕。',
            'include="~~/mpv-animejanai.conf"',
            'profile = animejanai',
            'osc=no',
            'border=no',
            'cursor-autohide=1000'
          ) -join "`n"
          Set-Content -Path 'overlay/portable_config/mpv.conf' -Value $mpvConf -Encoding utf8

          Invoke-WebRequest 'https://raw.githubusercontent.com/zydezu/ModernX/main/modernx.lua' -OutFile 'overlay/portable_config/scripts/modernx.lua'
          Invoke-WebRequest 'https://raw.githubusercontent.com/zydezu/ModernX/main/fluent-system-icons.ttf' -OutFile 'overlay/portable_config/fonts/fluent-system-icons.ttf'
          Invoke-WebRequest 'https://raw.githubusercontent.com/po5/thumbfast/master/thumbfast.lua' -OutFile 'overlay/portable_config/scripts/thumbfast.lua'
          Invoke-WebRequest 'https://raw.githubusercontent.com/po5/thumbfast/master/thumbfast.conf' -OutFile 'overlay/portable_config/script-opts/thumbfast.conf'
          Invoke-WebRequest 'https://raw.githubusercontent.com/po5/thumbfast/master/LICENSE' -OutFile 'overlay/THIRD_PARTY_LICENSES/thumbfast-LICENSE.txt'

          $modernx = @(
            'compact_mode=no',
            'info_button=yes',
            'screenshot_button=yes',
            'loop_button=yes',
            'download_button=no',
            'jump_amount=5',
            'jump_more_amount=60',
            'bottom_hover=yes',
            'bottom_hover_zone=280',
            'window_top_bar=auto',
            'window_controls=yes',
            'show_title=yes',
            'title_font_size=26',
            'time_font_size=24',
            'description_font_size=22',
            'playpause_size=40',
            'midbuttons_size=32',
            'sidebuttons_size=32',
            'scale_windowed=1.25',
            'scale_fullscreen=2.00',
            'scale_forced_window=1.25',
            'hide_timeout=1800'
          ) -join "`n"
          Set-Content -Path 'overlay/portable_config/script-opts/modernx.conf' -Value $modernx -Encoding utf8

          $thumb = Get-Content 'overlay/portable_config/script-opts/thumbfast.conf' -Raw
          $thumb = $thumb.Replace('max_height=200', 'max_height=360')
          $thumb = $thumb.Replace('max_width=200', 'max_width=560')
          $thumb = $thumb.Replace('network=no', 'network=yes')
          Set-Content -Path 'overlay/portable_config/script-opts/thumbfast.conf' -Value $thumb -Encoding utf8

          Copy-Item "$base/portable_config/scripts/animejanai_backend.lua" 'overlay/portable_config/scripts/animejanai_backend.lua' -Force
          Copy-Item "$base/portable_config/scripts/animejanai_engine_monitor.lua" 'overlay/portable_config/scripts/animejanai_engine_monitor.lua' -Force
          Copy-Item "$base/portable_config/scripts/animejanai_update.lua" 'overlay/portable_config/scripts/animejanai_update.lua' -Force
          Copy-Item "$base/portable_config/scripts/animejanaistats.lua" 'overlay/portable_config/scripts/animejanaistats.lua' -Force
          Copy-Item "$base/portable_config/scripts/animejanai_slot.lua" 'overlay/portable_config/scripts/animejanai_slot.lua' -Force

          Copy-Item manager-publish/*.exe 'overlay/' -Force
          Copy-Item manager-publish/*.dll 'overlay/' -Force
          Copy-Item updater-publish/AnimeJaNaiUpdater.exe 'overlay/AnimeJaNaiUpdater.exe' -Force
          Copy-Item mpvnet-publish/mpvnet.exe 'overlay/mpvnet.exe' -Force
          Copy-Item mpvnet-src/License.txt 'overlay/THIRD_PARTY_LICENSES/mpv.net-LICENSE.txt' -Force

          $note = @(
            'Player UI 外部播放器：直接指向 mpvnet.exe。',
            '这个 mpvnet.exe 基于官方 v7.1.2.0，只修复 Player UI 传入 --{ / --} 时被误当成属性的问题。',
            'mpv.exe 仍可作为备用。',
            '',
            '你的屏幕：2560x1600。16:9 视频满宽实际显示为 2560x1440，因此超分预设按 1440p 设计。',
            '',
            'Ctrl+1：24→48，只补帧（默认）',
            'Ctrl+2：24→72，只补帧',
            'Ctrl+3：30→60，只补帧',
            'Ctrl+4：1080p→1440p，只超分（高效）',
            'Ctrl+5：1080p→1440p，只超分（保真·高负载）',
            'Ctrl+6：720p及以下→最高1440p，只超分',
            'Ctrl+7：24→48 + 1080p→1440p，补帧+超分（高效）',
            'Ctrl+8：24→48 + 1080p→1440p，补帧+超分（保真·高负载）',
            'Ctrl+9：通用 2 倍，只补帧',
            'Ctrl+0：关闭 AI',
            'Esc：只退出全屏，不退出播放器'
          ) -join "`n"
          Set-Content -Path 'overlay/使用说明.txt' -Value $note -Encoding utf8

          Compress-Archive -Path 'overlay/*' -DestinationPath 'AnimeJaNai-2560x1600-全场景-mpvnet修复版.zip' -Force

      - name: Upload overlay
        uses: actions/upload-artifact@v4
        with:
          name: AnimeJaNai-2560x1600-personal-overlay
          path: AnimeJaNai-2560x1600-全场景-mpvnet修复版.zip
          if-no-files-found: error
