name: Remove release shortcut

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-releases.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Ctrl+U release-page behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')

          for rel in ('portable_config/input.conf', 'portable_config/input-animejanai.conf'):
              p = root / rel
              lines = p.read_text(encoding='utf-8-sig').splitlines()
              p.write_text('\n'.join(line for line in lines if 'animejanai-update' not in line) + '\n', encoding='utf-8')

          (root / 'portable_config/scripts/animejanai_update.lua').unlink(missing_ok=True)

          updater = root / 'tools/standalone/Updater.cs'
          updater.write_text(r'''using System.Management;
          using System.Text.Json;
          using System.Security.Cryptography;

          string root = AppContext.BaseDirectory;
          string mode = args.FirstOrDefault()?.ToLowerInvariant() ?? "--components";
          try
          {
              if (mode == "--components")
              {
                  string name = "Unknown";
                  bool nvidia = false;
                  try
                  {
                      using var query = new ManagementObjectSearcher("SELECT Name,PNPDeviceID FROM Win32_VideoController");
                      using var found = query.Get();
                      foreach (ManagementObject item in found)
                      {
                          using (item)
                          {
                              string n = item["Name"]?.ToString() ?? "Unknown";
                              bool nv = (item["PNPDeviceID"]?.ToString() ?? "").Contains("VEN_10DE", StringComparison.OrdinalIgnoreCase);
                              if (name == "Unknown" || nv) name = n;
                              nvidia |= nv;
                          }
                      }
                  }
                  catch (ManagementException) { }
                  catch (UnauthorizedAccessException) { }

                  using var doc = JsonDocument.Parse(File.ReadAllText(Path.Combine(root, "build-info", "standalone", "components.json")));
                  var packs = new List<object>();
                  foreach (var item in doc.RootElement.EnumerateArray())
                  {
                      string id = item.GetProperty("name").GetString()!;
                      bool installed = true;
                      long bytes = 0;
                      foreach (var entry in item.GetProperty("files").EnumerateArray())
                      {
                          string relative = entry.GetProperty("path").GetString()!;
                          string file = Path.GetFullPath(Path.Combine(root, relative));
                          if (!file.StartsWith(Path.GetFullPath(root), StringComparison.OrdinalIgnoreCase)) throw new InvalidDataException("Invalid component path");
                          long size = entry.GetProperty("bytes").GetInt64();
                          bytes += size;
                          installed &= File.Exists(file) && new FileInfo(file).Length == size;
                      }
                      packs.Add(new { name = id, bytes, installed, recommended = id == "rife" || (nvidia && id == "trt-runtime"), preselect = installed });
                  }
                  Console.WriteLine(JsonSerializer.Serialize(new { gpu = new { name, nvidia }, packs, version_mismatch = (string?)null, distribution = "full-portable", offline = true }));
                  return 0;
              }

              if (mode == "--verify")
              {
                  using var doc = JsonDocument.Parse(File.ReadAllText(Path.Combine(root, "build-info", "standalone", "SHA256.json")));
                  var bad = new List<string>();
                  foreach (var p in doc.RootElement.EnumerateObject())
                  {
                      if (p.Name.EndsWith(".conf", StringComparison.OrdinalIgnoreCase) || p.Name.EndsWith("interface-language.json", StringComparison.OrdinalIgnoreCase)) continue;
                      string file = Path.GetFullPath(Path.Combine(root, p.Name));
                      if (!file.StartsWith(Path.GetFullPath(root), StringComparison.OrdinalIgnoreCase)) throw new InvalidDataException("Invalid manifest path");
                      if (!File.Exists(file)) { bad.Add(p.Name); continue; }
                      using var f = File.OpenRead(file);
                      if (!Convert.ToHexString(SHA256.HashData(f)).Equals(p.Value.GetString(), StringComparison.OrdinalIgnoreCase)) bad.Add(p.Name);
                  }
                  Console.WriteLine(JsonSerializer.Serialize(new { ok = bad.Count == 0, failed = bad }));
                  return bad.Count == 0 ? 0 : 1;
              }

              Console.Error.WriteLine("Unsupported command: " + mode);
              return 2;
          }
          catch (Exception e) when (e is IOException or UnauthorizedAccessException or JsonException or InvalidOperationException)
          {
              Console.Error.WriteLine("Component check failed: " + e.Message);
              return 1;
          }
          ''', encoding='utf-8')

          build = root / 'tools/standalone/build.py'
          s = build.read_text(encoding='utf-8')
          s = s.replace("        s=s.replace('#menu: AnimeJaNai > 安装更新','#menu: AnimeJaNai > 检查本项目更新')\n", '')
          build.write_text(s, encoding='utf-8')

          publish = root / 'tools/standalone/publish.py'
          s = publish.read_text(encoding='utf-8')
          s = re.sub(
              r"readme=R/'README\.md';text=readme\.read_text\(encoding='utf-8'\)\n"
              r"line=f'.*?\n"
              r"first,rest=text\.split\('\\n',1\);readme\.write_text\(first\+'\\n'\+line\+'\\n'\+rest,encoding='utf-8'\)\n",
              '', s, flags=re.S)
          s = s.replace("paths+=[H/'dependencies.json',readme]", "paths+=[H/'dependencies.json']")
          if "readme=R/'README.md'" in s or "dependencies.json',readme" in s:
              raise SystemExit('publish.py README injection removal failed')
          publish.write_text(s, encoding='utf-8')

          doc = root / 'docs/standalone.md'
          s = doc.read_text(encoding='utf-8').replace('Ctrl+U 打开本仓库发布页，不会安装上游整包。', '')
          doc.write_text(s, encoding='utf-8')

          release = root / 'release.json'
          meta = json.loads(release.read_text(encoding='utf-8'))
          meta['version'] = '1.0.1'
          meta['tag'] = 'standalone-v1.0.1'
          release.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = root / 'tests/test_no_release_shortcut.py'
          test.write_text(r'''from pathlib import Path
          root = Path(__file__).resolve().parents[1]
          for rel in ("portable_config/input.conf", "portable_config/input-animejanai.conf"):
              text = (root / rel).read_text(encoding="utf-8-sig").lower()
              assert "animejanai-update" not in text, rel
              assert "ctrl+u" not in text, rel
          assert not (root / "portable_config/scripts/animejanai_update.lua").exists()
          updater = (root / "tools/standalone/Updater.cs").read_text(encoding="utf-8")
          for token in ("--open-releases", "MANUAL_UPDATE", "github.com/sunuuc/AnimeJaNai-zh-CN/releases"):
              assert token not in updater, token
          publish = (root / "tools/standalone/publish.py").read_text(encoding="utf-8")
          assert "readme=R/'README.md'" not in publish
          print("release-page shortcut absent")
          ''', encoding='utf-8')
          PY

          python tests/test_no_release_shortcut.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[release] 1.0.1：移除 Ctrl+U 发布页更新逻辑'
          git push
