name: Release cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-releases.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep 1.0.1 only
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: standalone-v1.0.1
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[] | [.id, .tag_name] | @tsv' > /tmp/releases.tsv
          kept=0
          while IFS=$'\t' read -r id tag; do
            [ -n "$id" ] || continue
            if [ "$tag" = "$KEEP_TAG" ]; then
              kept=$((kept + 1))
              continue
            fi
            gh api --method DELETE "repos/$repo/releases/$id"
            encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$tag")
            gh api --method DELETE "repos/$repo/git/refs/tags/$encoded" || true
          done < /tmp/releases.tsv
          [ "$kept" -eq 1 ]
          tags=$(gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name')
          [ "$tags" = "$KEEP_TAG" ]
