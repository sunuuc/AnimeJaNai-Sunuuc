name: Clean old source branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-old-source.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete old source branch
        run: git push origin --delete mpvnet-player_ui-source || true
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-old-source.yml
          git commit -m 'Remove temporary cleanup workflow'
          git push origin HEAD:main
