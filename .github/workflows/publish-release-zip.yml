name: Publish replacement ZIP to Releases

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release-zip.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build clean overlay ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'release-package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Get-ChildItem -Force | Where-Object {
            $_.Name -notin @('.git', '.github', 'release-package', 'AnimeJaNai-3.6.0-zh-CN-overlay.zip')
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $stage -Recurse -Force
          }

          Compress-Archive -Path "$stage\*" -DestinationPath 'AnimeJaNai-3.6.0-zh-CN-overlay.zip' -CompressionLevel Optimal -Force

      - name: Remove temporary workflow from main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-release-zip.yml
          git commit -m 'Remove temporary release packaging workflow'
          git push origin HEAD:main

      - name: Create GitHub Release and upload ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'zh-CN-3.6.0'
          $sha = git rev-parse HEAD
          $notes = @'
          AnimeJaNai 3.6.0 中文汉化覆盖包。

          使用方法：下载 ZIP，解压后直接覆盖到完整 AnimeJaNai 3.6.0 目录。

          包含：中文 AnimeJaNai Manager、RTX 5080 Laptop 预设、Sharp1 超分配置、Player UI 兼容 mpv.net、ModernX、thumbfast、更新器兼容修复，以及相关许可证文件。

          注意：这是个人定制版本，并非 AnimeJaNai 官方发布版。
          '@

          gh release create $tag 'AnimeJaNai-3.6.0-zh-CN-overlay.zip' `
            --repo $env:GITHUB_REPOSITORY `
            --target $sha `
            --title 'AnimeJaNai 3.6.0 中文汉化覆盖包' `
            --notes $notes
