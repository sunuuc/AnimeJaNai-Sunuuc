name: Cleanup unused branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete unused branches
        run: |
          git push origin --delete zh-CN || true
          git push origin --delete cleanup-unused-branches || true
          git push origin --delete tmp-clean || true
          git push origin --delete cleanup-runner || true
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-unused-branches.yml
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:main
