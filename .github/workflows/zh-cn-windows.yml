name: zh-CN Windows Package

on:
  push:
    branches: [zh-CN]
    paths:
      - '.github/workflows/zh-cn-windows.yml'
      - 'BuildMpvUpscale2xAnimeJaNai/**'
      - 'AnimeJaNaiUpdater/**'
      - 'installer/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream AnimeJaNai version (leave empty to use newest published release, including prerelease)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Chinese mpv-AnimeJaNai branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Chinese Manager branch
        uses: actions/checkout@v4
        with:
          repository: sunuuc/AnimeJaNaiManager
          ref: zh-CN
          path: manager-src
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Resolve upstream version
        shell: pwsh
        run: |
          $requested = '${{ github.event.inputs.version }}'
          if ($requested) {
            $ver = $requested.TrimStart('v')
          } else {
            $headers = @{ 'User-Agent' = 'AnimeJaNai-zh-CN-builder' }
            $rels = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/the-database/mpv-AnimeJaNai/releases?per_page=20'
            $rel = $rels | Where-Object { -not $_.draft } | Select-Object -First 1
            if (-not $rel) { throw 'Could not determine upstream release version.' }
            $ver = ([string]$rel.tag_name).TrimStart('v')
          }
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building zh-CN package for upstream $ver"

      - name: Merge matching upstream player source
        shell: pwsh
        run: |
          git config user.name 'zh-CN build bot'
          git config user.email 'actions@users.noreply.github.com'
          if (-not (git remote | Select-String '^upstream$')) {
            git remote add upstream https://github.com/the-database/mpv-AnimeJaNai.git
          }
          git fetch upstream --tags --force
          $candidates = @("refs/tags/$env:VER", "refs/tags/v$env:VER")
          $target = $null
          foreach ($candidate in $candidates) {
            git rev-parse --verify --quiet $candidate *> $null
            if ($LASTEXITCODE -eq 0) { $target = $candidate; break }
          }
          if (-not $target) { throw "Upstream release tag $env:VER was not found." }
          git merge --no-edit $target
          if ($LASTEXITCODE -ne 0) {
            throw 'The new upstream release conflicts with the zh-CN changes. Refusing to publish a stale or broken Chinese build.'
          }

      - name: Merge latest upstream Manager source
        shell: pwsh
        run: |
          Push-Location manager-src
          git config user.name 'zh-CN build bot'
          git config user.email 'actions@users.noreply.github.com'
          if (-not (git remote | Select-String '^upstream$')) {
            git remote add upstream https://github.com/the-database/AnimeJaNaiManager.git
          }
          git fetch upstream main --force
          git merge --no-edit upstream/main
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) {
            throw 'The latest Manager conflicts with the zh-CN localization. Refusing to publish an outdated Manager.'
          }

      - name: Build slim core and component packs
        shell: pwsh
        run: |
          dotnet publish BuildMpvUpscale2xAnimeJaNai/BuildMpvUpscale2xAnimeJaNai.csproj -c Release -o publish
          & ./publish/BuildMpvUpscale2xAnimeJaNai.exe $env:VER --packs

      - name: Build Chinese AnimeJaNai Manager
        shell: pwsh
        run: |
          dotnet publish manager-src/AnimeJaNaiConfEditor/AnimeJaNaiConfEditor.csproj `
            -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true `
            -o manager-publish
          $pkg = "publish/mpv-upscale-2x_animejanai-v$env:VER"
          Copy-Item manager-publish/*.exe $pkg/ -Force
          Copy-Item manager-publish/*.dll $pkg/ -Force

      - name: Build Chinese-channel updater
        shell: pwsh
        run: |
          $path = 'AnimeJaNaiUpdater/Program.cs'
          $src = Get-Content $path -Raw
          $old = 'const string Repo = "the-database/mpv-upscale-2x_animejanai";'
          $new = 'const string Repo = "sunuuc/mpv-AnimeJaNai";'
          if (-not $src.Contains($old)) { throw 'Updater repository constant was not found; upstream changed.' }
          $src = $src.Replace($old, $new)
          Set-Content -Path $path -Value $src -Encoding utf8
          dotnet publish AnimeJaNaiUpdater/AnimeJaNaiUpdater.csproj -c Release -o updater-publish
          $pkg = "publish/mpv-upscale-2x_animejanai-v$env:VER"
          Copy-Item updater-publish/AnimeJaNaiUpdater.exe "$pkg/AnimeJaNaiUpdater.exe" -Force

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Create easy portable Chinese package
        shell: pwsh
        run: |
          $pkg = "publish/mpv-upscale-2x_animejanai-v$env:VER"
          & 7z a -t7z -mx=9 "mpv-AnimeJaNai-zh-CN-$env:VER-win-x64.7z" $pkg
          if ($LASTEXITCODE -ne 0) { throw "7z portable archive failed: $LASTEXITCODE" }

      - name: Create updater full package
        shell: pwsh
        run: |
          $pkg = "publish/mpv-upscale-2x_animejanai-v$env:VER"
          & 7z a -t7z -mx=9 -v1900m "mpv-upscale-2x_animejanai-full-package-$env:VER.7z" $pkg
          if ($LASTEXITCODE -ne 0) { throw "7z update archive failed: $LASTEXITCODE" }

      - name: Create lightweight overlay and manifest
        shell: pwsh
        run: |
          $pkg = "publish/mpv-upscale-2x_animejanai-v$env:VER"
          Copy-Item "$pkg/manifest.json" manifest.json -Force
          $paths = (Get-Content "$pkg/manifest.json" -Raw | ConvertFrom-Json).overlay_paths
          $out = Join-Path (Get-Location) "mpv-upscale-2x_animejanai-overlay-$env:VER.7z"
          Push-Location $pkg
          & 7z a -t7z -mx=9 $out @paths
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "7z overlay archive failed: $rc" }

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-AnimeJaNai-zh-CN-${{ env.VER }}-win-x64
          path: mpv-AnimeJaNai-zh-CN-${{ env.VER }}-win-x64.7z
          if-no-files-found: error

      - name: Publish or refresh Chinese release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VER }}
          name: ${{ env.VER }} 简体中文版
          body: |
            基于上游 mpv-AnimeJaNai ${{ env.VER }} 的个人简体中文整合版。

            - 中文 mpv/mpv.net 右键菜单与 AnimeJaNai OSD
            - 中文 AnimeJaNai Manager
            - RIFE / TensorRT 组件管理保留
            - 在线更新通道指向 sunuuc/mpv-AnimeJaNai，避免更新后直接恢复英文
            - 自动构建时先合并对应上游版本；若汉化与上游冲突则停止发布，绝不把旧代码冒充新版本
            - `main` 保留上游，中文修改位于 `zh-CN`

            Windows 直接使用 `mpv-AnimeJaNai-zh-CN-${{ env.VER }}-win-x64.7z`。
          draft: false
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: >-
            mpv-AnimeJaNai-zh-CN-${{ env.VER }}-win-x64.7z,
            mpv-upscale-2x_animejanai-full-package-${{ env.VER }}.7z.*,
            mpv-upscale-2x_animejanai-overlay-${{ env.VER }}.7z,
            manifest.json,
            publish/packs-v${{ env.VER }}/component-*.7z,
            publish/packs-v${{ env.VER }}/packs.json
          token: ${{ secrets.GITHUB_TOKEN }}
