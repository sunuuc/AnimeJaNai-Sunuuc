name: Patch release realtime stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-release-realtime-stats.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download current release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/release /tmp/pkg
          gh release download zh-CN-3.6.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'AnimeJaNai-3.6.0-zh-CN-overlay.zip' \
            --dir /tmp/release
          unzip -q /tmp/release/AnimeJaNai-3.6.0-zh-CN-overlay.zip -d /tmp/pkg

      - name: Patch Ctrl+J script and README
        run: |
          mkdir -p /tmp/pkg/portable_config/scripts
          cp portable_config/scripts/animejanaistats.lua /tmp/pkg/portable_config/scripts/animejanaistats.lua
          cp README.md /tmp/pkg/README.md
          cd /tmp/pkg
          zip -qr /tmp/AnimeJaNai-3.6.0-zh-CN-overlay.zip .

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload zh-CN-3.6.0 /tmp/AnimeJaNai-3.6.0-zh-CN-overlay.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-release-realtime-stats.yml
          git commit -m 'Remove temporary release patch workflow'
          git push origin main
