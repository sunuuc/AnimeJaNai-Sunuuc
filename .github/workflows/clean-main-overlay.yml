name: Stage replacement text assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-main-overlay.yml'

permissions:
  contents: write

jobs:
  stage-text-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exact third-party replacement assets
        run: |
          mkdir -p portable_config/scripts THIRD_PARTY_LICENSES
          curl -fsSL https://raw.githubusercontent.com/zydezu/ModernX/main/modernx.lua -o portable_config/scripts/modernx.lua
          curl -fsSL https://raw.githubusercontent.com/po5/thumbfast/master/thumbfast.lua -o portable_config/scripts/thumbfast.lua
          curl -fsSL https://raw.githubusercontent.com/po5/thumbfast/master/LICENSE -o THIRD_PARTY_LICENSES/thumbfast-LICENSE.txt
          curl -fsSL https://raw.githubusercontent.com/mpvnet-player/mpv.net/v7.1.2.0/License.txt -o THIRD_PARTY_LICENSES/mpv.net-LICENSE.txt

      - name: Commit staged assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portable_config/scripts/modernx.lua portable_config/scripts/thumbfast.lua THIRD_PARTY_LICENSES/mpv.net-LICENSE.txt THIRD_PARTY_LICENSES/thumbfast-LICENSE.txt
          git commit -m "Stage replacement text assets for clean main"
          git push origin HEAD:main
