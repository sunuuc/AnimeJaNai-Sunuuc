name: Stage replacement configs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-main-overlay.yml'

permissions:
  contents: write

jobs:
  stage-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build final replacement configs
        shell: python
        run: |
          from pathlib import Path
          import re

          base = Path('BuildMpvUpscale2xAnimeJaNai/mpv-upscale-2x_animejanai')
          pc = Path('portable_config')
          (pc / 'script-opts').mkdir(parents=True, exist_ok=True)

          text = (base / 'portable_config/input-animejanai.conf').read_text(encoding='utf-8-sig')
          text = text.replace('Esc quit                                         #menu: 退出', '_ quit                                           #menu: 退出')
          text = text.replace('Up          seek -85 exact               #menu: 导航 > 向前跳 30 秒', 'Up          seek -85 exact               #menu: 导航 > 向后跳 85 秒')
          text = text.replace('Down        seek 85 exact               #menu: 导航 > 向后跳 30 秒', 'Down        seek 85 exact                #menu: 导航 > 向前跳 85 秒')

          names = {
              1: '补帧 2×', 2: '补帧 3×', 3: '2K 超分｜极速', 4: '2K 超分｜高质量',
              5: '4K 超分｜高质量', 6: '2×补帧 + 2K｜极速', 7: '2×补帧 + 2K｜高质量',
              8: '2×补帧 + 4K｜极速', 9: '3×补帧 + 2K｜极速'
          }
          for slot, name in names.items():
              line = f'Ctrl+{slot}   show-text "{name}"; apply-profile upscale-on; script-message aji-slot {slot} #menu: AnimeJaNai > 我的预设 > {slot} {name}'
              text = re.sub(rf'^Ctrl\+{slot}\s+show-text .*?script-message aji-slot {slot}.*$', line, text, flags=re.M)
          text = re.sub(r'^Ctrl\+0\s+show-text .*?script-message aji-slot 0.*$', 'Ctrl+0           show-text "AI 已关闭"; apply-profile upscale-on; script-message aji-slot 0', text, flags=re.M)
          (pc / 'input-animejanai.conf').write_text(text, encoding='utf-8')

          personal = [
              'Esc      set fullscreen no; show-text "已退出全屏" #menu: 画面 > 退出全屏',
              'Ctrl+0   show-text "AI 处理已关闭（原画原帧率）"; apply-profile upscale-on; script-message aji-slot 0 #menu: AnimeJaNai > 我的预设 > 关闭 AI 处理',
          ]
          for slot, name in names.items():
              personal.append(f'Ctrl+{slot}   show-text "{name}"; apply-profile upscale-on; script-message aji-slot {slot} #menu: AnimeJaNai > 我的预设 > {slot} {name}')

          generated = '\n'.join([
              '# 此区域由 AnimeJaNai 管理。更新时会从 input-animejanai.conf 刷新。',
              '#@ANIMEJANAI-MANAGED-BEGIN (do not edit this line or the block below)',
              text.rstrip(),
              '#@ANIMEJANAI-MANAGED-END (add your keybindings below this line)',
              '', '# ===== 你的个人快捷键（更新保留） =====', *personal, ''
          ])
          (pc / 'input.conf').write_text(generated, encoding='utf-8')

          (pc / 'mpv.conf').write_text('''# 个人版：AnimeJaNai + ModernX，针对 2560x1600 屏幕。\ninclude="~~/mpv-animejanai.conf"\nprofile = animejanai\nosc=no\nborder=no\ncursor-autohide=1000\n''', encoding='utf-8')

          (pc / 'script-opts/modernx.conf').write_text('''compact_mode=no\ninfo_button=yes\nscreenshot_button=yes\nloop_button=yes\ndownload_button=no\njump_amount=5\njump_more_amount=60\nbottom_hover=yes\nbottom_hover_zone=280\nwindow_top_bar=auto\nwindow_controls=yes\nshow_title=yes\ntitle_font_size=26\ntime_font_size=24\ndescription_font_size=22\nplaypause_size=40\nmidbuttons_size=32\nsidebuttons_size=32\nscale_windowed=1.25\nscale_fullscreen=2.00\nscale_forced_window=1.25\nhide_timeout=1800\n''', encoding='utf-8')

          (pc / 'script-opts/thumbfast.conf').write_text('''# Socket path (leave empty for auto)\nsocket=\n\n# Thumbnail path (leave empty for auto)\nthumbnail=\n\n# Maximum thumbnail generation size in pixels (scaled down to fit)\n# Values are scaled when hidpi is enabled\nmax_height=360\nmax_width=560\n\n# Scale factor for thumbnail display size (requires mpv 0.38+)\n# Note that this is lower quality than increasing max_height and max_width\nscale_factor=1\n\n# Apply tone-mapping, no to disable\ntone_mapping=auto\n\n# Overlay id\noverlay_id=42\n\n# Spawn thumbnailer on file load for faster initial thumbnails\nspawn_first=no\n\n# Close thumbnailer process after an inactivity period in seconds, 0 to disable\nquit_after_inactivity=0\n\n# Enable on network playback\nnetwork=yes\n\n# Enable on audio playback\naudio=no\n\n# Enable hardware decoding\nhwdec=no\n\n# Windows only: use native Windows API to write to pipe (requires LuaJIT)\ndirect_io=no\n\n# Custom path to the mpv executable\nmpv_path=mpv\n''', encoding='utf-8')

      - name: Commit staged configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portable_config/input-animejanai.conf portable_config/input.conf portable_config/mpv.conf portable_config/script-opts/modernx.conf portable_config/script-opts/thumbfast.conf
          git commit -m "Stage final replacement configs for clean main"
          git push origin HEAD:main
