name: Network playback source audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/network-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Snapshot tracked sources
        shell: python
        run: |
          from pathlib import Path
          import subprocess, zipfile
          out=Path('network-audit');out.mkdir()
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(out/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  p=Path(name)
                  if name and p.is_file() and p.suffix.lower() not in ('.ttf','.otf','.ttc','.woff','.woff2','.fon','.fnt'):
                      z.write(p,name)
          (out/'commit.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
      - uses: actions/upload-artifact@v4
        with:
          name: network-audit-source
          path: network-audit/
          retention-days: 3
          if-no-files-found: error
