name: Stage license compliance files and source branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/license-compliance.yml'

permissions:
  contents: write

jobs:
  compliance:
    runs-on: windows-latest
    steps:
      - name: Checkout replacement branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore upstream and third-party license texts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path THIRD_PARTY_LICENSES | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/the-database/mpv-AnimeJaNai/main/LICENSE' -OutFile 'LICENSE'
          Invoke-WebRequest 'https://raw.githubusercontent.com/the-database/AnimeJaNaiManager/main/LICENSE' -OutFile 'THIRD_PARTY_LICENSES/AnimeJaNaiManager-GPL-3.0.txt'

      - name: Checkout exact mpv.net source
        uses: actions/checkout@v4
        with:
          repository: mpvnet-player/mpv.net
          ref: v7.1.2.0
          path: mpvnet-source
          fetch-depth: 0

      - name: Apply exact Player UI compatibility patch to mpv.net source
        shell: pwsh
        run: |
          $path = 'mpvnet-source/src/MpvNet/CommandLine.cs'
          $src = Get-Content $path -Raw
          $needle = "            foreach (string i in Environment.GetCommandLineArgs().Skip(1))`r`n            {`r`n                string arg = i;"
          if (-not $src.Contains($needle)) {
            $needle = "            foreach (string i in Environment.GetCommandLineArgs().Skip(1))`n            {`n                string arg = i;"
          }
          if (-not $src.Contains($needle)) { throw 'mpv.net command-line parser pattern not found.' }
          $replacement = $needle.Replace('                string arg = i;', '                if (i == "--{" || i == "--}") continue;`n                string arg = i;')
          $replacement = $replacement.Replace('`n', [Environment]::NewLine)
          $src = $src.Replace($needle, $replacement)
          Set-Content -Path $path -Value $src -Encoding utf8

          @'
          # mpv.net Player UI 兼容修改源码

          本分支对应 main 中分发的 mpvnet.exe。

          - 上游项目：https://github.com/mpvnet-player/mpv.net
          - 基础版本：v7.1.2.0
          - 上游许可证：GPL-2.0
          - 修改内容：在 src/MpvNet/CommandLine.cs 中忽略 Player UI 外部播放器调用可能传入的 `--{` 与 `--}` 两个参数，避免被 mpv.net 当作属性解析。
          - 构建命令：

          ```powershell
          dotnet publish src/MpvNet.Windows/MpvNet.Windows.csproj -c Release -r win-x64 --self-contained false -o mpvnet-publish
          ```

          除上述兼容修改外，源码基线保持 mpv.net v7.1.2.0。
          '@ | Set-Content -Path 'mpvnet-source/SUNUUC_SOURCE_INFO.md' -Encoding utf8

      - name: Publish complete modified mpv.net source branch
        shell: pwsh
        run: |
          Set-Location mpvnet-source
          git config user.name 'sunuuc'
          git config user.email '77818773+sunuuc@users.noreply.github.com'
          git add src/MpvNet/CommandLine.cs SUNUUC_SOURCE_INFO.md
          git commit -m 'Player UI compatibility patch for mpv.net v7.1.2.0'
          git remote add target "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force target HEAD:mpvnet-player_ui-source

      - name: Commit license files and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE THIRD_PARTY_LICENSES/AnimeJaNaiManager-GPL-3.0.txt
          git rm .github/workflows/license-compliance.yml
          git commit -m 'Restore licenses and publish corresponding source'
          git push origin HEAD:main
